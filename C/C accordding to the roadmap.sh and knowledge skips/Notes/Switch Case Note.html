                        <h1>Switch Case Note</h1>
                        <p><p>In GNU C you can do this:</p>
<pre><code class="language-C">
switch (x) {
    case 1 ... 5:
        print(&quot;In range of 1...5\n&quot;);
        break
    default:
        print(&quot;dunno&quot;);
}
</code></pre></p>
