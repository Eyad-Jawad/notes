                <h1>Enums</h1>
                <p>Enums are declared as structs in C, other than that they have the same features as C++ enums:</p>
<pre><code class="language-C">
typedef enum optional_name_here {
    FIRST,
    SECOND,
    FOURTH = 4,
    FIFTH,
} names;

printf(&quot;First: %d\n&quot;, FIRST);

</code></pre>
