                    <h1>Errors</h1>
                    <p><h2 id="setup-the-error-buffer">Setup The Error Buffer</h2>
<p>To set up the error buffer you don't need to do much:</p>
<pre><code class="language-C">
char buf[CURL_ERROR_SIZE];
curl_easy_setopt(curl, CURLOPT_ERRORBUFFER, buf);

</code></pre>
<p>And if an error occurs you can print <code>buf</code></p></p>
