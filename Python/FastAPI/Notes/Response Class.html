                <h1>Response Class</h1>
                <p>You can use <code>response_class</code> in  <code>FastAPI</code> to tell it how to contruct the return value, the default is <code>json</code>, but you can also return html:</p>
<pre><code class="language-Python">
from fastapi.responses import HTMLResponse


@app.get(&quot;/&quot;, response_class=HTMLResponse)
def get_root():
    return &quot;&lt;h1&gt;Hi&lt;/h1&gt;&quot;

</code></pre>
