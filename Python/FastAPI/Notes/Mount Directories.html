            <article>
                <h1>Mount Directories</h1>
                <p>To use files/directories that are independent from the app, but are needed:</p>
<pre><code class="language-Python">
app.mount(&quot;/file&quot;, name=&quot;app&quot;)

</code></pre>
<p>And in case they are static files:</p>
<pre><code class="language-Python">
from fastapi.staticfiles import StaticFiles

app.mount(&quot;/dir&quot;, StaticFiles(directory=&quot;static&quot;), name=&quot;static&quot;)
</code></pre>
            </article>

        </body>
