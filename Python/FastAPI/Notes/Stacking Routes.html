                <h1>Stacking Routes</h1>
                <p>If you want two routes to return the same content, like the <code>/</code> and and some <code>/root</code> you'd do:</p>
<pre><code class="language-Python">
@app.get(&quot;/&quot;)
@app.get(&quot;/root&quot;)
def get_root():
    return 1
