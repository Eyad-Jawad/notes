            <article>
                <h1>Pathlib Path Parents</h1>
                <p>A <code>parent</code> is just the directory above the current one, you can use <code>parents[i]</code> to get the i-th parent and avoid a long chain of parent:</p>
<pre><code class="language-Python">
from pathlib import Path


dir = Path(__file__).resolve().parent
higher_dir = dir.parents[2]

</code></pre>
            </article>
