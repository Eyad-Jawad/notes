                <h1>Pathlib Path with_</h1>
                <p>If you want to change something about the <code>Path</code> object without creating a new one, or using <code>rename()</code> which changes the actual file, you can use <code>with_</code>, there are many of them:</p>
<pre><code class="language-Python">
path = path.with_stem(&quot;filename&quot;)
path = path.with_suffix(&quot;.py&quot;)
path = paht.with_name = &quot;main.py&quot;

</code></pre>
