                        <h1>Async Testing</h1>
                        <p><p>In the standard package of <code>pytest</code>, that's why you typically need the plugin <code>pytest-asyncio</code> to make a an async test, which you need to install via <code>pip</code> or <code>uv</code>:</p>
<pre><code class="language-Python">
import pytest


@pytest.mark.asyncio
async def test_some_async_func():
    assert await some_async_func() == &quot;Result&quot;
